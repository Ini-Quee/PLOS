name: Deploy backend to Azure App Service

on:
  push:
    branches:
      - main
      - feature/lumi-local-router

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: iniq
  NODE_VERSION: "22.x"
  APP_PACKAGE_PATH: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.APP_PACKAGE_PATH }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.APP_PACKAGE_PATH }}
        run: npm ci --omit=dev

      - name: Validate server syntax
        working-directory: ${{ env.APP_PACKAGE_PATH }}
        run: node --check server.js

      - name: Run tests if configured
        working-directory: ${{ env.APP_PACKAGE_PATH }}
        run: npm test --if-present

      - name: Remove node_modules before deployment
        working-directory: ${{ env.APP_PACKAGE_PATH }}
        run: rm -rf node_modules

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.APP_PACKAGE_PATH }}
